<div class="contenedor">
  <h2>Reportes</h2>

  <div class="cards-grid">
    <div class="card-indicador card-total">
      <div class="card-numero">{{ totalRegistrado }}</div>
      <div class="card-etiqueta">Total Registrado</div>
    </div>

    <div class="card-indicador card-pendiente">
      <div class="card-numero">{{ pendienteDeGestion }}</div>
      <div class="card-etiqueta">Pendiente de gestión</div>
    </div>

    <div class="card-indicador card-finalizado">
      <div class="card-numero">{{ procesoTerminado }}</div>
      <div class="card-etiqueta">Proceso terminado</div>
    </div>
  </div>
</div>
