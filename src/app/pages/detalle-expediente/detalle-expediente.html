<div class="detalle">
    <h1>Detalle Expediente</h1>

    @if (expediente) {
        <div class="card">
            <p><strong>ID:</strong> {{ expediente.id}}</p>
            <p><strong>Nombre:</strong> {{ expediente.nombre }}</p>
            <p><strong>Estado:</strong> {{ expediente.estado }}</p>
            <p><strong>Priodidad:</strong> {{ expediente.prioridad }}</p>
            <p><strong>Fecha creación:</strong> {{ expediente.fechaCreacion }}</p>
        </div>
    }
   @else {
    <div class="mensaje-error-contenedor">
      <p class="mensaje-error">⚠️ No se encontró el expediente solicitado.</p>
      <button class="btn-primario" routerLink="/bandeja">Regresar a la lista</button>
    </div>
   } 
</div>
